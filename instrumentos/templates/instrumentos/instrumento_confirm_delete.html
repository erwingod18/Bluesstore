{% extends 'base.html' %}

{% block title %}Eliminar instrumento | Blues Store{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-danger shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 text-danger mb-3">¿Eliminar este instrumento?</h1>
                <p class="mb-3">
                    Estás a punto de eliminar <strong>{{ instrumento.nombre }}</strong>.
                    Esta acción no se puede deshacer.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Sí, eliminar
                        </button>
                        <a href="{% url 'instrumentos:lista' %}" class="btn btn-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
